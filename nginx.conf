server {
    listen 80;

    server_name _;

    root /usr/share/nginx/html;

    index index.html;

    server_tokens off;

    # --- Security Headers (no add_header in the locations below, so both inherit these) ---
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Report-only first: check the browser console for violations, then rename to Content-Security-Policy
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' ${APP_URL}; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    location / {
        ssi on;
        set $nginx_ssi_url "${APP_URL}";
        set $nginx_ssi_env "${APP_ENV}";
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
